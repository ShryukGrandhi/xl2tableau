[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xl2tableau"
version = "0.1.0"
description = "Migrate Excel calculated columns to Tableau calculated fields, with row-level verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
xl2tableau = "xl2tableau.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
